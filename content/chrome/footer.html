<div class="site-footer__inner">
  <div class="site-footer__grid">
    <div>
      <h2>{name}</h2>
      <p>{library}<br />{location}<br />{address}</p>
    </div>
    <div>
      <h2>{whenHeading}</h2>
      <p>{schedule}</p>
    </div>
    <div>
      <h2>{exploreHeading}</h2>
      <ul data-slot="explore"></ul>
    </div>
    <div>
      <h2>{contactHeading}</h2>
      <p>
        <a href="{phoneHref}">{phone}</a><br />
        <a href="mailto:{contactEmail}">{contactEmail}</a><br />
        <a href="{rsvpUrl}" rel="noopener noreferrer" target="_blank">{rsvpLabel}</a><br />
        <a href="{registerUrl}" rel="noopener noreferrer" target="_blank">{registerLabel}</a><br />
        <a href="{discordUrl}" rel="noopener noreferrer" target="_blank">{discordLabel}</a><br />
        <a href="{githubUrl}" rel="noopener noreferrer" target="_blank">{githubLabel}</a><br />
        <a href="{website}">{websiteLabel}</a>
      </p>
    </div>
  </div>
  <p class="site-footer__meta">{footerMeta}</p>
</div>
