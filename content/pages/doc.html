<article class="{wrapClass}">
  <header class="page-hero">
    <p class="section__eyebrow" data-optional>{eyebrow}</p>
    <h1>{title}</h1>
    <p data-optional>{lede}</p>
  </header>
  <div data-slot="banner"></div>
  <div class="prose" data-slot="body"></div>
  <footer class="doc-footer">
    <p class="content-back"><a href="{backHref}">{backPrefix}{backLabel}</a></p>
    <div class="doc-contrib">
      <p class="fix-typo" data-slot="fix-typo"></p>
      <p class="fix-typo" data-slot="new-page"></p>
    </div>
  </footer>
</article>
